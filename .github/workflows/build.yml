name: Build ImmortalWrt XG-040G-MD UBI

on:
  workflow_dispatch:
  schedule:
    # Every Sunday at 04:00 Beijing/Hong Kong time (Saturday 20:00 UTC)
    - cron: "0 20 * * 6"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
      - "config/**"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: immortalwrt-xg040g-md-ubi
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      SOURCE_REPO: https://github.com/immortalwrt/immortalwrt.git
      SOURCE_BRANCH: master
      DEVICE_PATTERN: nokia_xg-040g-md-ubi
      TARGET_DIR: bin/targets/airoha/an7581
      DEVICE_CONFIG: CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y

    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl libelf-dev \
            qemu-utils ccache xsltproc

      - name: Clone latest ImmortalWrt
        run: |
          git clone --depth=1 --branch "$SOURCE_BRANCH" "$SOURCE_REPO" openwrt
          cd openwrt
          git log -1 --oneline

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply source customizations
        working-directory: openwrt
        run: |
          bash ../scripts/customize.sh

      - name: Apply and validate firmware configuration
        working-directory: openwrt
        run: |
          cat ../config/xg040g-md-ubi.config ../config/general-packages.config > .config
          make defconfig

          echo "Selected target settings:"
          grep -E '^CONFIG_TARGET_airoha|^CONFIG_TARGET_airoha_an7581' .config || true

          if ! grep -Fxq "$DEVICE_CONFIG" .config; then
            echo "ERROR: expected device profile was not selected after make defconfig:"
            echo "  $DEVICE_CONFIG"
            echo
            echo "Available/selected AN7581 device settings:"
            grep -E '^CONFIG_TARGET_airoha_an7581_DEVICE_' .config || true
            exit 1
          fi

          echo "Confirmed device profile: $DEVICE_PATTERN"

          echo "Validating every GENERAL runtime package requested with =y..."
          missing=0
          while IFS= read -r line; do
            case "$line" in
              CONFIG_PACKAGE_*=y)
                if ! grep -Fxq "$line" .config; then
                  echo "MISSING after make defconfig: $line"
                  missing=1
                fi
                ;;
            esac
          done < ../config/general-packages.config

          # OpenClash declares these as direct runtime dependencies. Validate them
          # explicitly so a build can never be published with OpenClash selected
          # but an unresolved critical dependency.
          for pkg in dnsmasq-full bash curl ca-bundle ip-full ruby ruby-yaml kmod-tun unzip; do
            if ! grep -Fxq "CONFIG_PACKAGE_${pkg}=y" .config; then
              echo "MISSING OpenClash dependency after make defconfig: CONFIG_PACKAGE_${pkg}=y"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "ERROR: required GENERAL/OpenClash package set is incomplete."
            exit 1
          fi

          echo "GENERAL package set and OpenClash dependencies validated."

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j"$(nproc)"
          find dl -size -1024c -delete || true

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j"$(nproc)" V=s

      - name: Collect firmware and recovery images
        run: |
          mkdir -p output

          find "openwrt/$TARGET_DIR" -maxdepth 1 -type f \
            -name "*${DEVICE_PATTERN}*sysupgrade.itb" \
            -exec cp -v {} output/ \;

          find "openwrt/$TARGET_DIR" -maxdepth 1 -type f \
            -name "*${DEVICE_PATTERN}*recovery.itb" \
            -exec cp -v {} output/ \;

          if ! compgen -G "output/*sysupgrade.itb" > /dev/null; then
            echo "Expected XG-040G-MD UBI sysupgrade image was not produced."
            echo "Files produced for airoha/an7581:"
            find "openwrt/$TARGET_DIR" -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

          if ! compgen -G "output/*recovery.itb" > /dev/null; then
            echo "Expected XG-040G-MD UBI recovery image was not produced."
            exit 1
          fi

          (cd output && sha256sum *.itb > SHA256SUMS)
          ls -lh output

      - name: Prepare release metadata
        id: release
        shell: bash
        run: |
          BUILD_DATE="$(TZ=Asia/Shanghai date +'%Y.%m.%d-%H%M')"
          SOURCE_SHA="$(git -C openwrt rev-parse --short=12 HEAD)"
          TAG="immortalwrt-${BUILD_DATE}-r${GITHUB_RUN_NUMBER}"
          RELEASE_NAME="ImmortalWrt XG-040G-MD UBI ${BUILD_DATE}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-XG-040G-MD-UBI
          path: output/
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_NAME: ${{ steps.release.outputs.name }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          cat > release-notes.md <<EOF
          ## Nokia XG-040G-MD (all-in-UBI)

          Automated ImmortalWrt build for Nokia XG-040G-MD / Airoha AN7581.

          - Device profile: \`nokia_xg-040g-md-ubi\`
          - Source branch: \`${SOURCE_BRANCH}\`
          - ImmortalWrt source commit: \`${SOURCE_SHA}\`
          - GitHub Actions run: \`${GITHUB_RUN_NUMBER}\`
          - Runtime package baseline: Bingoguo GENERAL package set
          - Critical third-party packages: OpenClash, Lucky, GecoosAC, wolplus, Airoha NPU LuCI

          ### Files

          - \`*-squashfs-sysupgrade.itb\` — normal firmware upgrade after MedveFlasher/all-in-UBI migration
          - \`*-initramfs-recovery.itb\` — RAM/TFTP recovery image
          - \`SHA256SUMS\` — checksums

          > Do not flash these images directly onto stock Nokia firmware or the legacy non-UBI/tcboot layout.
          EOF

          gh release create "$RELEASE_TAG" output/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_NAME" \
            --notes-file release-notes.md \
            --latest
