name: Build ImmortalWrt XG-040G-MD UBI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
      - "config/**"
      - "scripts/**"

permissions:
  contents: read

concurrency:
  group: immortalwrt-xg040g-md-ubi
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      SOURCE_REPO: https://github.com/immortalwrt/immortalwrt.git
      SOURCE_BRANCH: master
      DEVICE_PATTERN: nokia_xg-040g-md-ubi
      TARGET_DIR: bin/targets/airoha/an7581
      DEVICE_CONFIG: CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y

    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl libelf-dev \
            qemu-utils ccache xsltproc

      - name: Clone ImmortalWrt
        run: |
          git clone --depth=1 --branch "$SOURCE_BRANCH" "$SOURCE_REPO" openwrt
          cd openwrt
          git log -1 --oneline

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply source customizations
        working-directory: openwrt
        run: |
          bash ../scripts/customize.sh

      - name: Apply and validate firmware configuration
        working-directory: openwrt
        run: |
          cp ../config/xg040g-md-ubi.config .config
          make defconfig

          echo "Selected target settings:"
          grep -E '^CONFIG_TARGET_airoha|^CONFIG_TARGET_airoha_an7581' .config || true

          if ! grep -Fxq "$DEVICE_CONFIG" .config; then
            echo "ERROR: expected device profile was not selected after make defconfig:"
            echo "  $DEVICE_CONFIG"
            echo
            echo "Available/selected AN7581 device settings:"
            grep -E '^CONFIG_TARGET_airoha_an7581_DEVICE_' .config || true
            exit 1
          fi

          echo "Confirmed device profile: $DEVICE_PATTERN"

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j"$(nproc)"
          find dl -size -1024c -delete || true

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j"$(nproc)" V=s

      - name: Collect firmware and recovery images
        run: |
          mkdir -p output

          find "openwrt/$TARGET_DIR" -maxdepth 1 -type f \
            -name "*${DEVICE_PATTERN}*sysupgrade.itb" \
            -exec cp -v {} output/ \;

          find "openwrt/$TARGET_DIR" -maxdepth 1 -type f \
            -name "*${DEVICE_PATTERN}*recovery.itb" \
            -exec cp -v {} output/ \;

          if ! compgen -G "output/*sysupgrade.itb" > /dev/null; then
            echo "Expected XG-040G-MD UBI sysupgrade image was not produced."
            echo "Files produced for airoha/an7581:"
            find "openwrt/$TARGET_DIR" -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

          (cd output && sha256sum * > SHA256SUMS)
          ls -lh output

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-XG-040G-MD-UBI
          path: output/
          if-no-files-found: error
          retention-days: 14
